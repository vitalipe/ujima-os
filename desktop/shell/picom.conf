# picom, the compositor (xrender — no GL on the Pi): real transparency for the shell's surfaces (the
# top pane at home, the lock screen) instead of a black block, ~130ms fades on window open/close
# (workspace switches stay hard cuts: picom keeps window state across unmap, so a re-shown window
# is not an "open"), and the dialog treatment in `rules`. i3 launches it (shell/i3/config).
backend = "xrender";
unredir-if-possible = true;
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 10;

# shadows are opt-in per rule; these shape every shadow a rule turns on
shadow = false;
shadow-radius = 28;
shadow-opacity = 0.6;
shadow-offset-x = -28;
shadow-offset-y = -20;

# per-window rules — later rules override earlier ones for the options they set. Once `rules`
# is set, picom 12 ignores the legacy *-exclude / wintypes / corner-radius-rules options, so
# everything window-specific lives here.
rules = (
  # the boot cover is full-screen and opaque until it fades out to the desktop: unredirecting it
  # would flicker the hand-back, and its own opacity steps are the fade
  { match = "class_g = 'ujima-shell' && name = 'Cover'"; unredir = false; fade = false; },
  # tooltip cards: a GTK app's tooltip toplevel has no working alpha, so GTK cannot round it; the
  # shell's own card is drawn at the same 10 and comes through unchanged
  { match = "window_type = 'tooltip'"; corner-radius = 10; },
  # a floating dialog is a card over its app, like the Files app's own dialogs: lifted + rounded.
  # i3 draws no frame for floaters (default_floating_border none), so this IS the frame
  { match = "(window_type = 'dialog' || window_type = 'utility') && !override_redirect"; shadow = true; corner-radius = 12; },
  # a dialog that fills the band is a page, not a card: the GTK file chooser (i3 tiles it), the
  # ujima picker (floating so its app stays visible, sized to the band) and GIMP's own file
  # dialogs (gimp-file-* roles: floating, but i3 clamps them to the band)
  { match = "role = 'GtkFileChooserDialog' || role ^= 'gimp-file' || class_g = 'ujima-filepicker'"; shadow = false; corner-radius = 0; },
  # menus get a lighter lift
  { match = "window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'menu'"; shadow = true; corner-radius = 8; },
  # the scrim: the app behind a focused dialog dims. The bars are docks, never `normal`, never
  # dimmed; a non-modal dialog that loses focus lets its app brighten again
  { match = "window_type = 'normal' && !focused && !override_redirect"; dim = 0.4; }
);
