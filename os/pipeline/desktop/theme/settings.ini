# managed by the ujima image build — source: os/pipeline/desktop/theme/settings.ini
#
# shell typography + app-content theme, system-wide GTK defaults: Nordic + /etc/gtk-3.0
# give GTK app content (pcmanfm, LO, dialogs) the design's Nord side; Public Sans is the
# shell face (eww.scss) — vendored data files, no apt, so the skin is freeze-safe. Qt
# apps follow via QT_QPA_PLATFORMTHEME=gtk3 (session/ujima.service).
[Settings]
gtk-theme-name=Nordic
gtk-application-prefer-dark-theme=1
gtk-font-name=Public Sans 10
# the file chooser: no Recent view (GTK then opens at cwd, and keeps no recently-used ledger on a
# shared machine); the module hides the chooser's places sidebar, so every GTK dialog is the Places
# screen + crumbs — the sidebar-less dialog the file model wants (source: desktop/chooser)
gtk-recent-files-enabled=0
gtk-modules=/ujima/desktop/lib/libujima-chooser.so
