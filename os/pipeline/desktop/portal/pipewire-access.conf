# managed by the ujima image build — source: os/pipeline/desktop/portal/pipewire-access.conf
#
# Every local client gets full access, whatever the sandbox check says. PipeWire's access
# module takes any process whose root holds /.flatpak-info for a Flatpak app and withholds
# its permissions until the session manager grants them. The portal's machine-wide marker
# makes that every process — WirePlumber included, which then waits forever on its own
# first registry sync (an idle spin at 100% CPU) and no client is ever served. ujima runs
# no real sandboxes and physical access is root, so unrestricted is the truth. The stock
# module instance is switched off through its condition key and loaded again in socket
# mode, where the socket's value is final (legacy mode has no such knob).
context.properties = { module.access = false }
context.modules = [
  { name = libpipewire-module-access
    args = { access.socket = { pipewire-0 = "unrestricted" pipewire-0-manager = "unrestricted" } } }
]
