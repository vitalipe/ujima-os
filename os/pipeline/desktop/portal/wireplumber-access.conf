# managed by the ujima image build — source: os/pipeline/desktop/portal/wireplumber-access.conf
#
# The second gate behind pipewire-access.conf. WirePlumber's client script regrades any
# client flagged as a Flatpak app to read+execute — itself included, so it can never set a
# device profile and no sink is ever created — and pipewire-pulse pre-tags its own clients
# (chromium, electron) the same way under pipewire.client.access. A matching rule is
# consulted before that default; both keys get the same answer: everything.
access.rules = [
  { matches = [ { pipewire.sec.flatpak = "true" } { pipewire.client.access = "flatpak" } ]
    actions = { update-props = { default_permissions = "all" access = "unrestricted" } } }
]
