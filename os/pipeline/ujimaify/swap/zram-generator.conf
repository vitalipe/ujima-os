# managed by the ujima image build — source: os/pipeline/ujimaify/swap/zram-generator.conf
#
# Overrides rpi-swap's generated zram0 settings. lz4 over the default zstd-3: swap-in 219 vs
# 75 MB/s at 1.6:1 vs 2.1:1 (Pi 5). Half of RAM on every board, not rpi-swap's 2048 MiB clamp.
[zram0]
compression-algorithm = lz4
zram-size = ram / 2
