# managed by the ujima image build — source: os/pipeline/ujimaify/session/memory-session-scope.conf
#
# Xorg, i3 and ujimad live in the logind session scope (ujima.service's PAMName=login), so the
# grant is a prefix drop-in every session-N.scope takes when created. MemoryMin, not MemoryLow:
# the soft grant was breached thousands of times per pile-up. Idle use ~216M.
[Scope]
MemoryMin=256M
