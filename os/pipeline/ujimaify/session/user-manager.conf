# managed by the ujima image build — source: os/pipeline/ujimaify/session/user-manager.conf
#
# An unprivileged user manager can only set a unit's OOMScoreAdjust= at or above its own, and
# systemd logs the refusal at debug level only (HW: the shell's -900 silently became +100). PID 1
# sets the manager's score as root, so the floor goes here; app scopes re-raise to +800 at launch.
[Service]
OOMScoreAdjust=-900
