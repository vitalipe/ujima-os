# managed by the ujima image build — source: os/pipeline/base/smb/smb.conf
#
# One static config. What a machine shares is the CONTENT of the two roots below — directories
# of symlinks ujimad keeps — never this file; smbd runs only while they hold something.
[global]
   server role = standalone server
   server string = UjimaOS
   disable netbios = yes
   smb ports = 445
   local master = no
   dns proxy = no

   # SMB3 only, symlinks followed server-side (unix extensions are SMB1's; off for wide links)
   server min protocol = SMB3_00
   unix extensions = no
   follow symlinks = yes
   wide links = yes

   # one account, its password derived from the circle token; a guest session cannot be
   # encrypted, so there is none
   security = user
   map to guest = Never
   passdb backend = tdbsam
   server smb encrypt = required

   # every remote write lands as the local user, like a stick mounted uid=ujima
   force user = ujima
   force group = ujima
   create mask = 0664
   directory mask = 0775

   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log level = 1
   logging = file
   log file = /var/log/samba/smbd.log
   max log size = 1000

[rw]
   path = /ujima/run/shares/rw
   read only = no
   valid users = ujima

[ro]
   path = /ujima/run/shares/ro
   read only = yes
   valid users = ujima
